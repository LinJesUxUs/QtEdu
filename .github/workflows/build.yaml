name: QmlShaderEffect

on:
  push:
    branches:
      - QmlShaderEffect
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt for Desktop
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.2.4'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtimageformats qtshadertools'
        cache: true

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.2.4'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        setup-python: 'false'
        cache: true

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        packages: ''

    - name: sdkmanager job
      run: |
        sdkmanager "build-tools;31.0.0" "cmdline-tools;latest" "ndk;22.1.7171670" "platform-tools" "platforms;android-31"
        sdkmanager --list_installed

    - name: Build App
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/22.1.7171670
        export PATH="$(pwd)/../Qt/6.2.4/android_arm64_v8a/bin:$(pwd)/../Qt/6.2.4/gcc_64/bin:$JAVA_HOME/bin:$ANDROID_SDK_ROOT/ndk/22.1.7171670/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
        export NDK_MAKE=$ANDROID_NDK_ROOT/prebuilt/linux-x86_64/bin/make
        export QMAKE=$(pwd)/../Qt/6.2.4/android_arm64_v8a/bin/qmake
        export ANDROIDDEPLOYQT=$(pwd)/../Qt/6.2.4/gcc_64/bin/androiddeployqt
        $QMAKE edu.pro -spec android-clang CONFIG+=debug
        $NDK_MAKE -f Makefile qmake_all
        $NDK_MAKE -j4
        $NDK_MAKE INSTALL_ROOT=android-build install
        $ANDROIDDEPLOYQT --input android-QmlShaderEffect-deployment-settings.json --output android-build --android-platform android-31 --gradle

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android package kit
        path: android-build/build/outputs/apk/debug/*.apk

