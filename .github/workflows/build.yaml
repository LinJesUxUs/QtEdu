name: QmlShaderEffect

on:
  push:
    branches:
      - QmlShaderEffect
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt for Desktop
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.2.4'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtimageformats qtshadertools'

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.2.4'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        setup-python: 'false'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android
      uses: android-actions/setup-android@v3

    - name: sdkmanager job
      run: |
        sdkmanager "ndk;22.1.7171670" "build-tools;31.0.0" "platforms;android-31"
        sdkmanager --list_installed
        exit 1

    - name: Build App
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/22.1.7171670
        export PATH="$(pwd)/../Qt/6.2.4/android_arm64_v8a/bin:$(pwd)/../Qt/6.2.4/gcc_64/bin:$JAVA_HOME/bin:$ANDROID_SDK_ROOT/ndk/22.1.7171670/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
        qsb --glsl '"100 es,120,150"' --hlsl 50 --msl 12 -o src/shader.frag.qsb src/shader.frag
        qmake edu.pro -spec android-clang CONFIG+=release
        make -f Makefile qmake_all
        make -j4
        make INSTALL_ROOT=android-build install
        androiddeployqt --input android-QmlShaderEffect-deployment-settings.json --output android-build --android-platform android-31 --gradle
    - uses: actions/upload-artifact@v4
      with:
        name: Android package kit
        path: android-build/build/outputs/apk/debug/*.apk

